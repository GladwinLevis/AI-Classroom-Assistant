name: AI Classroom Assistant CI/CD Pipeline

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  backend-test:
    name: Run Backend Test Suite & Linting
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: ai_classroom_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
          pip install pytest pytest-asyncio

      - name: Run Pytest Suite
        env:
          DATABASE_URL: "postgresql+asyncpg://postgres:postgrespassword@localhost:5432/ai_classroom_test"
          SYNC_DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/ai_classroom_test"
          REDIS_URL: "redis://localhost:6379/0"
          GOOGLE_API_KEY: "mock-google-api-key"
          SECRET_KEY: "test-secret-key-ci-cd"
        run: |
          cd backend
          python -m pytest

  frontend-build:
    name: Build & Verify Frontend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Frontend Dependencies
        run: npm ci

      - name: Build React Vite Application
        run: npm run build
